name: Test PR

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - example/**
      - .changeset/**
permissions:
  contents: read
  id-token: write
  pull-requests: write
  actions: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout Repository
        with:
          submodules: recursive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish packages
        run: pnpm dlx pkg-pr-new publish './packages/dvz-ui' './packages/react-lib/wp-react-lib' --packageManager=pnpm --commentWithSha --comment=create
