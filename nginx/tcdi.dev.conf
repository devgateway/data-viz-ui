error_log /var/log/nginx/error.log info;
rewrite_log on;

fastcgi_cache_path /var/cache/nginx/wp levels=1 keys_zone=wp:128k inactive=1h;
proxy_cache_path /var/cache/nginx/render levels=2 keys_zone=render:256k inactive=30d;
proxy_cache render;
proxy_cache_key $uri;

upstream php_fcgi {
  server wordpress:9000;
}

upstream prerender_upstream {
  server prerender:2500;
}

map $http_user_agent $prerender {
  default 0;
  ~[Bb]ot\b 1;
  ~[Ss]pider\b 1;
  ~\bYandex 1;
  ~WhatsApp 1;
  ~facebookexternalhit 1;
  ~facebookcatalog 1;
  ~*embedly 1;
  ~Quora 1;
  ~*outbrain 1;
  ~*pinterest\b 1;
  ~*vkshare 1;
  ~*w3c_validator 1;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  gzip on;
  gzip_vary on;

  root /var/www/static;

  if ($args ~ "_escaped_fragment_") {
    set $prerender 1;
  }

  if ($uri ~* "\.(css|jpe?g|js(on)?|png|xml|gif|pdf|(doc|xls|ppt)x?)$") {
    set $prerender 0;
  }

  location / {
    try_files $uri $uri/ /index.html;
    proxy_set_header Accept-Encoding '';
    proxy_set_header Origin '';
    proxy_ignore_headers Vary;
    if ($prerender = 1) {
      rewrite ^ /render/http://nginx$request_uri? break;
      proxy_pass http://prerender_upstream;
      add_header X-Cache-Status $upstream_cache_status;
    }
    proxy_cache_valid 30d;
  }

  location /wp {
    alias /var/www/html;
    index index.php admin.php;
    # https://trac.nginx.org/nginx/ticket/97
    # bug in Nginx worked around by doubling location prefix:
    try_files $uri $uri/ /wp/wp/index.php$is_args$args;

    location ~ \.php$ {
      include fastcgi.conf;
      fastcgi_split_path_info ^/wp(.+\.php)(.*)$;
      fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;

      #fastcgi_param HTTPS 'on' ; # set $_SERVER['HTTPS']
      fastcgi_param SERVER_NAME $host; # set $_SERVER['SERVER_NAME']
      fastcgi_param HTTP_HOST $host; # set $_SERVER['HTTP_HOST']


      fastcgi_param SERVER_NAME $host; # set $_SERVER['SERVER_NAME']
      fastcgi_param HTTP_HOST $host; # set $_SERVER['HTTP_HOST']
      fastcgi_pass php_fcgi;
      fastcgi_cache wp;
      fastcgi_cache_key $request_uri;
      fastcgi_cache_valid 15m;
      add_header X-Cache-Status $upstream_cache_status;
    }
  }

  location /pdf {
    gunzip on;
    proxy_set_header Accept-Encoding '';
    proxy_set_header Origin '';
    proxy_ignore_headers Vary;
    proxy_pass http://prerender_upstream/pdf/http://nginx;
    proxy_cache_valid 30d;
    add_header X-Cache-Status $upstream_cache_status;
  }

location /admin/ {
      gunzip on;
      client_max_body_size 10M;
      set $admin admin:8083;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Server $host;
      proxy_set_header X-Forwarded-Prefix /admin;
      proxy_pass http://$admin;
  }

 location /api/ {

       # Preflighted requests
       if ($request_method = OPTIONS ) {
         add_header "Access-Control-Allow-Origin"  *;
         add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, HEAD";
         add_header "Access-Control-Allow-Headers" "Authorization, Origin, X-Requested-With, Content-Type, Accept";
         return 200;
       }

      gunzip on;
      client_max_body_size 10M;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Server $host;
      proxy_set_header X-Forwarded-Prefix /api;
      proxy_pass http://zuul:8762/;
  }


}
